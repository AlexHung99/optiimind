    (function() {
      var products = [{
        slug: 'optilitedb',
        image: 'assets/optilitedb/optilitedb_pomo_banner.webp',
        href: 'optilitedb.html',
        tags: {
          en: ['Unity', 'SQLite', 'Runtime API', 'Zero DLL'],
          zh: ['Unity', 'SQLite', 'Runtime API', '零 DLL']
        },
        title: {
          en: 'OptiLiteDB',
          zh: 'OptiLiteDB'
        },
        subtitle: {
          en: 'SQLite Browser & Runtime API for Unity',
          zh: 'Unity SQLite 瀏覽器與 Runtime API'
        },
        desc: {
          en: 'Browse, edit, import, export, query, and ship local SQLite data inside Unity with a lean native-linking architecture.',
          zh: '在 Unity 內瀏覽、編輯、匯入、匯出與查詢 SQLite 資料，並以輕量原生動態連結架構發布。'
        },
        cta: {
          en: 'View product',
          zh: '查看產品'
        }
      }, {
        slug: 'optilogin',
        image: 'assets/optilogin/OptiLogin_POMO.webp',
        href: 'optilogin.html',
        tags: {
          en: ['Unity', 'Authentication', 'Login UI', 'UI Toolkit'],
          zh: ['Unity', '驗證系統', '登入 UI', 'UI Toolkit']
        },
        title: {
          en: 'OptiLogin',
          zh: 'OptiLogin'
        },
        subtitle: {
          en: 'Login UI & Authentication System for Unity',
          zh: 'Unity 登入 UI 與驗證系統'
        },
        desc: {
          en: 'Build a polished multilingual sign-in flow with themes, guided setup, and REST API, UGS, or Firebase authentication backends.',
          zh: '建立精緻的多語系登入流程，支援主題預設、設定精靈，以及 REST API、UGS 或 Firebase 驗證後端。'
        },
        cta: {
          en: 'View product',
          zh: '查看產品'
        }
      }];

      products = products.filter(function(product) {
        return product.slug !== 'optilitedb';
      });

      var copy = {
        en: {
          nav: 'Products',
          label: 'Products',
          title: 'Product Catalog',
          sub: 'Browse Optiimind products and open each item for details, screenshots, and technical notes.'
        },
        zh: {
          nav: '產品',
          label: '產品',
          title: '產品清單',
          sub: '瀏覽 Optiimind 產品，點選縮圖後進入完整介紹、截圖與技術細節頁面。'
        }
      };

      function requestedLang() {
        var lang = new URLSearchParams(window.location.search).get('lang');
        return lang === 'zh' || lang === 'en' ? lang : null;
      }

      function rememberLang(lang) {
        try { localStorage.setItem('optimind-lang', lang); } catch (error) {}
        return lang;
      }

      function detectLang() {
        var requested = requestedLang();
        if (requested) return rememberLang(requested);
        var text = document.body ? document.body.innerText : '';
        if (text.indexOf('客製軟體工作室') !== -1 || text.indexOf('服務') !== -1) return rememberLang('zh');
        if (text.indexOf('Custom Development') !== -1 || text.indexOf('Services') !== -1) return rememberLang('en');
        try {
          var stored = localStorage.getItem('optimind-lang');
          if (stored === 'zh' || stored === 'en') return stored;
        } catch (error) {}
        return 'en';
      }

      function productUrl(product, lang) {
        return product.href + '?lang=' + encodeURIComponent(lang);
      }

      window.setOptiLang = function(lang) {
        var next = lang === 'zh' ? 'zh' : 'en';
        try { localStorage.setItem('optimind-lang', next); } catch (error) {}
        var url = new URL(window.location.href);
        url.searchParams.set('lang', next);
        window.location.href = url.pathname + url.search + url.hash;
      };

      window.setZh = function() { window.setOptiLang('zh'); };
      window.setEn = function() { window.setOptiLang('en'); };

      function applyRequestedSiteLanguage() {
        var requested = requestedLang();
        if (requested) rememberLang(requested);
      }

      function ensureStyle() {
        if (document.getElementById('opti-products-style')) return;
        var style = document.createElement('style');
        style.id = 'opti-products-style';
        style.textContent = [
          '#products{padding:100px 40px;background:transparent;scroll-margin-top:80px;color:#E8E9E6}',
          '.opti-products-wrap{max-width:1140px;margin:0 auto}',
          '.opti-products-label{margin-bottom:14px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#0ABAB5;font-weight:700}',
          '.opti-products-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,420px);gap:40px;align-items:end;margin-bottom:44px}',
          '.opti-products-title{font-family:Sora,"Noto Sans TC",sans-serif;font-weight:700;font-size:44px;line-height:1.12;color:#F3F4F1;letter-spacing:0}',
          '.opti-products-sub{font-size:16px;line-height:1.75;color:#A7AAA2}',
          '.opti-products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}',
          '.opti-product-card{display:block;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:8px;text-decoration:none;color:#F3F4F1;box-shadow:none;transition:transform .2s ease,border-color .2s ease,background .2s ease}',
          '.opti-product-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.07);border-color:rgba(10,186,181,.48)}',
          '.opti-product-media{position:relative;aspect-ratio:16/10;background:#14161A;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.10)}',
          '.opti-product-media img{width:100%;height:100%;object-fit:cover;display:block}',
          '.opti-product-body{padding:22px;display:flex;flex-direction:column;gap:10px}',
          '.opti-product-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#0ABAB5;font-weight:700}',
          '.opti-product-title{font-family:Sora,"Noto Sans TC",sans-serif;font-size:24px;line-height:1.18;color:#F3F4F1;font-weight:700;margin:0;letter-spacing:0}',
          '.opti-product-subtitle{font-size:15px;color:#A7AAA2;line-height:1.45}',
          '.opti-product-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}',
          '.opti-product-tags span{font-size:12px;color:#D5D8D1;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:7px 10px}',
          '.opti-product-cta{margin-top:8px;font-size:14px;font-weight:700;color:#0ABAB5}',
          '@media(max-width:860px){#products{padding:78px 22px}.opti-products-head{grid-template-columns:1fr}.opti-products-title{font-size:38px}.opti-product-body{padding:20px}.opti-product-title{font-size:22px}}'
        ].join('');
        document.head.appendChild(style);
      }

      function ensureNav(lang) {
        var existing = document.querySelector('[data-opti-products-nav]') || document.querySelector('a[href="#products"], a[href^="/products.html"]');
        var services = Array.prototype.slice.call(document.querySelectorAll('a[href="#services"]')).find(function(link) {
          var text = link.textContent.trim();
          return text === 'Services' || text === '服務';
        });
        if (!existing && services && services.parentNode) {
          existing = document.createElement('a');
          existing.style.cssText = services.style.cssText;
          services.parentNode.insertBefore(existing, services.nextSibling);
        }
        if (existing) {
          existing.setAttribute('data-opti-products-nav', '');
          var href = '/products.html?lang=' + lang;
          if (existing.getAttribute('href') !== href) existing.setAttribute('href', href);
          if (existing.textContent !== copy[lang].nav) existing.textContent = copy[lang].nav;
        }
      }

      function renderProducts() {
        if (!document.body || !document.getElementById('services')) return;
        ensureStyle();
        var lang = detectLang();
        document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
        ensureNav(lang);
        var section = document.getElementById('products');
        if (section && section.getAttribute('data-lang') === lang) return;
        if (!section) {
          section = document.createElement('section');
          section.id = 'products';
          var anchor = document.getElementById('work') || document.getElementById('tech') || document.getElementById('contact');
          if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(section, anchor);
          else document.body.appendChild(section);
        }
        section.setAttribute('data-lang', lang);
        var c = copy[lang];
        section.innerHTML =
          '<div class="opti-products-wrap">' +
            '<div class="opti-products-head">' +
              '<div><div class="opti-products-label">' + c.label + '</div><h2 class="opti-products-title">' + c.title + '</h2></div>' +
              '<p class="opti-products-sub">' + c.sub + '</p>' +
            '</div>' +
            '<div class="opti-products-grid">' +
              products.map(function(product) {
                return '<a class="opti-product-card" href="' + productUrl(product, lang) + '">' +
                  '<div class="opti-product-media"><img loading="lazy" decoding="async" src="' + product.image + '" alt="' + product.title[lang] + '"></div>' +
                  '<div class="opti-product-body">' +
                    '<div class="opti-product-kicker">' + product.subtitle[lang] + '</div>' +
                    '<h3 class="opti-product-title">' + product.title[lang] + '</h3>' +
                    '<div class="opti-product-tags">' + product.tags[lang].map(function(tag) { return '<span>' + tag + '</span>'; }).join('') + '</div>' +
                    '<div class="opti-product-cta">' + product.cta[lang] + '</div>' +
                  '</div>' +
                '</a>';
              }).join('') +
            '</div>' +
          '</div>';
      }

      var scheduled = false;
      function scheduleRender() {
        if (scheduled) return;
        scheduled = true;
        setTimeout(function() {
          scheduled = false;
          renderProducts();
        }, 120);
      }

      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(applyRequestedSiteLanguage, 250);
        setTimeout(applyRequestedSiteLanguage, 1200);
        scheduleRender();
        setTimeout(scheduleRender, 900);
        setTimeout(scheduleRender, 2200);
        new MutationObserver(scheduleRender).observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
</body></html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>停車模擬器 Parking Simulator</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #101317;
  color: #e8ebef;
  font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
}

.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: #171b21;
  border-bottom: 1px solid #262c35;
  flex: 0 0 auto;
}
.topbar h1 { font-size: 17px; margin: 0; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.btn {
  background: #262c35;
  color: #e8ebef;
  border: 1px solid #333a45;
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
}
.btn:hover { background: #2f3743; }
.btn-primary { background: #2d6cdf; border-color: #2d6cdf; }
.btn-primary:hover { background: #3a78ea; }
.btn-help { text-decoration: none; display: inline-block; }

.speed-label { font-size: 12px; color: #9aa4b2; display: flex; align-items: center; gap: 6px; }
.speed-label input[type=range] { width: 90px; }

.main { flex: 1 1 auto; display: flex; min-height: 0; }

.panel {
  width: 300px;
  flex: 0 0 auto;
  overflow-y: auto;
  padding: 14px;
  background: #14171c;
  border-right: 1px solid #262c35;
}

.group {
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid #21252c;
}
.group h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #7f8a9b;
  margin: 0 0 10px;
}

.field { margin-bottom: 10px; }
.field label {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: #c7ceda;
  margin-bottom: 4px;
}
.field input[type=range] { width: 100%; }

.segmented { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid #333a45; }
.seg {
  flex: 1;
  background: #1c2129;
  color: #aab3c0;
  border: none;
  padding: 7px 4px;
  font-size: 12px;
  cursor: pointer;
  border-right: 1px solid #333a45;
}
.seg:last-child { border-right: none; }
.seg.active { background: #2d6cdf; color: #fff; }
.seg:hover:not(.active) { background: #262c35; }

.readout { font-size: 12px; color: #7f8a9b; margin-top: 6px; }

.checkbox { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #c7ceda; margin-bottom: 8px; }

.warning {
  background: #3a2a15;
  border: 1px solid #7a5424;
  color: #ffcf8a;
  border-radius: 6px;
  padding: 10px;
  font-size: 12px;
  line-height: 1.5;
}
.warning.notice {
  background: #14283a;
  border-color: #2d5b8a;
  color: #9ccaff;
}

.stage {
  flex: 1 1 auto;
  position: relative;
  min-width: 0;
  display: flex;
}
#canvas { width: 100%; height: 100%; display: block; }

.hud {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 10px;
}
.hud-item {
  background: rgba(20,23,28,.85);
  border: 1px solid #333a45;
  border-radius: 8px;
  padding: 8px 12px;
  min-width: 64px;
  text-align: center;
}
.hud-label { display: block; font-size: 10px; color: #7f8a9b; margin-bottom: 2px; }
.hud-item span:last-child { font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🚗 停車模擬器</h1>
    <div class="topbar-actions">
      <button id="btnPlay" class="btn btn-primary">▶ 播放</button>
      <button id="btnStep" class="btn">單步</button>
      <button id="btnReset" class="btn">重置</button>
      <label class="speed-label">速度
        <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
        <span id="speedVal">1.0x</span>
      </label>
      <a href="formulas.html" target="_blank" class="btn btn-help" title="軌跡計算公式說明">📘 說明</a>
    </div>
  </header>

  <div class="main">
    <aside class="panel">

      <section class="group">
        <h2>停車格類型</h2>
        <div class="segmented" id="spotTypeGroup">
          <button data-type="perp" class="seg active">垂直</button>
          <button data-type="angle" class="seg">斜角</button>
          <button data-type="parallel" class="seg">平行</button>
        </div>
        <div class="field" id="angleField" style="display:none">
          <label>傾斜角度 <span id="angleDegVal">45°</span></label>
          <input type="range" id="angleDeg" min="20" max="80" step="1" value="45">
        </div>
      </section>

      <section class="group">
        <h2>進場方向</h2>
        <div class="field">
          <label>模擬方向</label>
          <div class="segmented">
            <button data-sim="in" class="seg active">駛入停車格</button>
            <button data-sim="out" class="seg">停妥後駛出</button>
          </div>
        </div>
        <div class="field">
          <label>車道行駛方向</label>
          <div class="segmented">
            <button data-lane="1" class="seg active">由左向右 →</button>
            <button data-lane="-1" class="seg">由右向左 ←</button>
          </div>
        </div>
        <div class="field">
          <label>停車格位置</label>
          <div class="segmented">
            <button data-row="1" class="seg active">車道下方 ▽</button>
            <button data-row="-1" class="seg">車道上方 △</button>
          </div>
        </div>
        <div class="field" id="entryModeField">
          <label>入庫方式</label>
          <div class="segmented">
            <button data-entry="reverse" class="seg active">倒車入庫</button>
            <button data-entry="forward" class="seg">前進入庫</button>
          </div>
        </div>
        <div class="field" id="parkStyleField" style="display:none">
          <label>停車方式</label>
          <div class="segmented">
            <button data-park="normal" class="seg active">一般停車</button>
            <button data-park="deep" class="seg">深切停車</button>
          </div>
        </div>
      </section>

      <section class="group">
        <h2>車輛尺寸</h2>
        <div class="field">
          <label>車種</label>
          <div class="segmented">
            <button data-vehicle="car" class="seg active">四輪汽車</button>
            <button data-vehicle="trike" class="seg">三輪車 前2後1</button>
          </div>
        </div>
        <div class="readout" id="vehicleNote" style="display:none">前輪轉向的三輪車：車身路徑與四輪車相同，但後方僅一條中央輪跡，後內輪差較小。</div>
        <div class="field">
          <label>車長 <span id="carLengthVal">2.47 m</span></label>
          <input type="range" id="carLength" min="0.5" max="5" step="0.01" value="2.47">
        </div>
        <div class="field">
          <label>車寬 <span id="carWidthVal">0.97 m</span></label>
          <input type="range" id="carWidth" min="0.5" max="5" step="0.01" value="0.97">
        </div>
        <div class="field">
          <label>軸距 (前後輪距) <span id="wheelbaseVal">1.80 m</span></label>
          <input type="range" id="wheelbase" min="0.5" max="5" step="0.05" value="1.8">
        </div>
        <div class="field">
          <label>輪距 (左右輪距) <span id="trackVal">0.85 m</span></label>
          <input type="range" id="track" min="0.5" max="3" step="0.05" value="0.85">
        </div>
        <div class="field">
          <label>最小迴轉半徑 <span id="turnRadiusVal">3.6 m</span></label>
          <input type="range" id="turnRadius" min="2" max="9" step="0.1" value="3.6">
        </div>
        <div class="readout" id="steerReadout">最大轉向角：約 26°</div>
      </section>

      <section class="group">
        <h2>停車格與車道</h2>
        <div class="field">
          <label>停車格寬度 <span id="spotWidthVal">2.5 m</span></label>
          <input type="range" id="spotWidth" min="0.5" max="5" step="0.1" value="2.5">
        </div>
        <div class="field">
          <label>停車格深度 <span id="spotDepthVal">6.0 m</span></label>
          <input type="range" id="spotDepth" min="0.5" max="10" step="0.1" value="6">
        </div>
        <div class="field">
          <label>車道寬度 <span id="laneWidthVal">6 m</span></label>
          <input type="range" id="laneWidth" min="2" max="10" step="0.1" value="6">
        </div>
      </section>

      <section class="group">
        <h2>顯示選項</h2>
        <label class="checkbox"><input type="checkbox" id="showPath" checked> 顯示規劃路徑</label>
        <label class="checkbox"><input type="checkbox" id="showTrail" checked> 顯示行駛軌跡</label>
        <label class="checkbox"><input type="checkbox" id="showWheelTrail" checked> 顯示車輪軌跡（輪跡）</label>
        <label class="checkbox"><input type="checkbox" id="showMeasure" checked> 顯示尺寸標註</label>
      </section>

      <div id="warningBox" class="warning" style="display:none"></div>
    </aside>

    <main class="stage">
      <canvas id="canvas"></canvas>
      <div class="hud">
        <div class="hud-item"><span class="hud-label">檔位</span><span id="hudGear">D</span></div>
        <div class="hud-item"><span class="hud-label">方向盤</span><span id="hudSteer">0°</span></div>
        <div class="hud-item"><span class="hud-label">進度</span><span id="hudProgress">0%</span></div>
      </div>
    </main>
  </div>
</div>
<script>
(() => {
"use strict";

// ---------- vector helpers ----------
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }),
  sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  scale: (a, s) => ({ x: a.x * s, y: a.y * s }),
  dot: (a, b) => a.x * b.x + a.y * b.y,
  cross: (a, b) => a.x * b.y - a.y * b.x,
  len: (a) => Math.hypot(a.x, a.y),
  fromAngle: (rad) => ({ x: Math.cos(rad), y: Math.sin(rad) }),
  angle: (a) => Math.atan2(a.y, a.x),
  leftNormal: (h) => ({ x: -h.y, y: h.x }), // rotate +90 deg
  rotate90ccwUnit: (a) => ({ x: -a.y, y: a.x }),
};
const RAD = Math.PI / 180;

// ---------- path segments ----------
// A segment: { length, gear, curvatureSign, sample(sLocal) => {pos:{x,y}, theta} }

function makeStraight(startPos, theta, length, gear) {
  const h = V.fromAngle(theta);
  return {
    length,
    gear,
    curvatureSign: 0,
    sample(s) {
      return { pos: V.add(startPos, V.scale(h, s * gear)), theta };
    },
  };
}

function makeArc(C, R, turnSign, gear, thetaStart, length) {
  return {
    length,
    gear,
    curvatureSign: turnSign,
    sample(s) {
      const theta = thetaStart + gear * turnSign * (s / R);
      const h = V.fromAngle(theta);
      const pos = V.sub(C, V.scale(V.leftNormal(h), R * turnSign));
      return { pos, theta, kappa: turnSign / R };
    },
  };
}

// Numerically integrated segment from a precomputed pose table (clothoid S-curve).
function makeTableSegment(P0, table, gear) {
  const last = table.xs.length - 1;
  return {
    length: table.S,
    gear,
    curvatureSign: 0,
    sample(s) {
      const f = Math.min(last, Math.max(0, s / table.ds));
      const i0 = Math.floor(f), i1 = Math.min(last, i0 + 1), t = f - i0;
      const lerp = (a) => a[i0] + (a[i1] - a[i0]) * t;
      return {
        pos: { x: P0.x + lerp(table.xs), y: P0.y + lerp(table.ys) },
        theta: lerp(table.ths),
        kappa: lerp(table.ks),
      };
    },
  };
}

// Reverse S-curve with rate-limited steering: curvature ramps 0 -> +k over
// dRamp, holds L, swings to -k over 2*dRamp, holds L, returns to 0 over dRamp.
// Antisymmetric profile, so the net heading change is zero.
function integrateSCurve(kS, L, dRamp, thetaStart, gear) {
  const S = 4 * dRamp + 2 * L;
  const ds = 0.02;
  const kappaAt = (s) => {
    if (s < dRamp) return (kS * s) / dRamp;
    if (s < dRamp + L) return kS;
    if (s < 3 * dRamp + L) return kS * (1 - (s - dRamp - L) / dRamp);
    if (s < 3 * dRamp + 2 * L) return -kS;
    if (s < S) return -kS * (1 - (s - 3 * dRamp - 2 * L) / dRamp);
    return 0;
  };
  const xs = [0], ys = [0], ths = [thetaStart], ks = [0];
  let x = 0, y = 0, th = thetaStart;
  for (let s = ds; s <= S + 1e-9; s += ds) {
    th += gear * kappaAt(s - ds / 2) * ds;
    x += gear * Math.cos(th) * ds;
    y += gear * Math.sin(th) * ds;
    xs.push(x); ys.push(y); ths.push(th); ks.push(kappaAt(s));
  }
  return { S, ds, xs, ys, ths, ks, dx: x, dy: y };
}

// One-sided wind: curvature ramps 0 -> kS over dR, holds Lh, ramps back to 0.
// Net heading change = gear * kS * (dR + Lh).
function integrateWind(kS, Lh, dR, thetaStart, gear) {
  const S = 2 * dR + Lh;
  const ds = 0.02;
  const kappaAt = (s) => (s < dR ? (kS * s) / dR : s < dR + Lh ? kS : s < S ? kS * (1 - (s - dR - Lh) / dR) : 0);
  const xs = [0], ys = [0], ths = [thetaStart], ks = [0];
  let x = 0, y = 0, th = thetaStart;
  for (let s = ds; s <= S + 1e-9; s += ds) {
    th += gear * kappaAt(s - ds / 2) * ds;
    x += gear * Math.cos(th) * ds;
    y += gear * Math.sin(th) * ds;
    xs.push(x); ys.push(y); ths.push(th); ks.push(kappaAt(s));
  }
  return { S, ds, xs, ys, ths, ks, dx: x, dy: y };
}

// Find hold length L (or reduced peak curvature) so the S-curve's lateral
// displacement matches targetDy. Both relations are monotonic, so bisect.
function solveSCurve(targetDy, kMax, dRamp0, thetaStart, gear, turnSignK) {
  const dyOf = (kPeak, L, dR) => integrateSCurve(kPeak * turnSignK, L, dR, thetaStart, gear).dy;
  const target = Math.abs(targetDy);
  // Cap the mid-manoeuvre swing angle (= kPeak*(dRamp+L)) at ~50° by default:
  // keeps the path realistic and dy monotonic in L (valid up to <90°) so the
  // bisection below works. Overridable for experiments via state.thetaCap.
  const THETA_CAP = state.thetaCap || 0.87;
  const LCap = Math.max(0, THETA_CAP / kMax - dRamp0);
  let kPeak = kMax, L = 0, dRamp = dRamp0, feasible = true;
  if (Math.abs(dyOf(kMax, 0, dRamp0)) >= target) {
    // Overshoot even with no full-lock hold. Keep the wheel at FULL lock and
    // shorten the wind distance instead of shallowing the steer — the decisive
    // "cut deep, then counter-steer" that drivers actually use.
    const dMin = 0.3;
    if (Math.abs(dyOf(kMax, 0, dMin)) >= target) {
      dRamp = dMin;
      let lo = 1e-3, hi = kMax;
      for (let i = 0; i < 36; i++) {
        const mid = (lo + hi) / 2;
        if (Math.abs(dyOf(mid, 0, dMin)) >= target) hi = mid; else lo = mid;
      }
      kPeak = hi;
    } else {
      let lo = dMin, hi = dRamp0;
      for (let i = 0; i < 36; i++) {
        const mid = (lo + hi) / 2;
        if (Math.abs(dyOf(kMax, 0, mid)) >= target) hi = mid; else lo = mid;
      }
      dRamp = hi;
    }
  } else if (Math.abs(dyOf(kMax, LCap, dRamp0)) < target) {
    feasible = false;
    L = LCap;
  } else {
    let lo = 0, hi = LCap;
    for (let i = 0; i < 36; i++) {
      const mid = (lo + hi) / 2;
      if (Math.abs(dyOf(kMax, mid, dRamp0)) >= target) hi = mid; else lo = mid;
    }
    L = hi;
  }
  return { kPeak, L, dRamp, feasible };
}

// ---------- collision helpers ----------
function rectCorners(cx, cy, hl, hw, th) {
  const c = Math.cos(th), s = Math.sin(th);
  return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([ex, ey]) => ({
    x: cx + c * hl * ex - s * hw * ey,
    y: cy + s * hl * ex + c * hw * ey,
  }));
}

function egoCorners(p, geo, pose) {
  const cLocal = { x: (p.wheelbase + geo.frontOverhang - geo.rearOverhang) / 2, y: 0 };
  const c = V.add(pose.pos, rotateLocal(cLocal, pose.theta));
  return rectCorners(c.x, c.y, p.carLength / 2, p.carWidth / 2, pose.theta);
}

function polysIntersectSAT(A, B) {
  for (const poly of [A, B]) {
    for (let i = 0; i < poly.length; i++) {
      const p1 = poly[i], p2 = poly[(i + 1) % poly.length];
      const ax = p1.y - p2.y, ay = p2.x - p1.x;
      let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
      for (const pt of A) { const d = pt.x * ax + pt.y * ay; if (d < minA) minA = d; if (d > maxA) maxA = d; }
      for (const pt of B) { const d = pt.x * ax + pt.y * ay; if (d < minB) minB = d; if (d > maxB) maxB = d; }
      if (maxA < minB || maxB < minA) return false;
    }
  }
  return true;
}


// "Deep dive" two-move plan: reverse in steeply, overshooting past the parked
// line toward the kerb (the bay is wider than the car), tail near the rear
// car — then a single full-lock forward arc swings the nose in and lands
// exactly aligned. One gear change instead of many shuffle cycles.
function buildDeepDive(p, geo, thetaStart, aisleDir, yDrive, yFinal, kMax, tS, neighbors) {
  const R = 1 / kMax;
  const dR = 0.6;
  const carCenterOff = (p.wheelbase + geo.frontOverhang - geo.rearOverhang) / 2;
  const uCenter = -carCenterOff; // rear-axle u when the body is centred in the bay
  const uFrontLim = p.spotDepth / 2 - (p.wheelbase + geo.frontOverhang) - 0.15;
  // Overshoot toward the kerb is bounded by the bay's spare width.
  const maxOver = Math.max(0, p.spotWidth / 2 - p.carWidth / 2 - 0.05);
  const phiCap = Math.acos(Math.max(-1, Math.min(1, 1 - maxOver / R)));
  const lnf = V.leftNormal(V.fromAngle(thetaStart));

  const attempt = (uEnd, phi1, force) => {
    const finalPos = { x: uEnd * p.laneDir, y: yFinal };
    const C = V.add(finalPos, V.scale(lnf, R * tS));
    const thDive = thetaStart - tS * phi1;
    const hDive = V.fromAngle(thDive);
    const Pstart = V.sub(C, V.scale(V.leftNormal(hDive), R * tS)); // forward-arc start
    const dEff = Math.min(dR, phi1 / kMax);
    const Lh = Math.max(0, phi1 / kMax - dEff);
    const wind = integrateWind(kMax * tS, Lh, dEff, thetaStart, -1);
    const dyPerM = -Math.sin(thDive); // per metre of straight reverse at the dive angle
    if (Math.abs(dyPerM) < 1e-4) return null;
    const d1 = (Pstart.y - yDrive - wind.dy) / dyPerM;
    if (d1 < -0.01 && !force) return null; // wind alone overshoots: steeper than needed
    const d1c = Math.max(0, d1);
    const windEnd = V.add(Pstart, V.scale(hDive, d1c));
    const P0 = { x: windEnd.x - wind.dx, y: windEnd.y - wind.dy };
    const segs = [
      makeStraight(V.sub(P0, V.scale(aisleDir, APPROACH_LEN)), thetaStart, APPROACH_LEN, 1),
      makeTableSegment(P0, wind, -1),
    ];
    if (d1c > 0.01) segs.push(makeStraight(windEnd, thDive, d1c, -1));
    segs.push(makeArc(C, R, tS, 1, thDive, R * phi1));
    const dCentre = uEnd - uCenter;
    if (dCentre > 0.02) segs.push(makeStraight(finalPos, thetaStart, dCentre, -1));
    // Wheel straightened in place at the end.
    const parkedPos = { x: uCenter * p.laneDir, y: yFinal };
    segs.push(makeStraight(parkedPos, thetaStart, 0.02, 1));
    return { path: buildPath(segs), phi1, moves: dCentre > 0.02 ? 3 : 2 };
  };

  // Prefer ending the forward arc already centred; fall back to ending snug
  // behind the front stall and backing up straight to centre. If every angle
  // collides, return the deepest attempt with its impact point — no fallback,
  // playback stops at the collision.
  let nominal = null;
  for (const uEnd of [uCenter, uFrontLim]) {
    for (let phi1 = Math.max(0.15, Math.min(0.7, phiCap)); phi1 >= 0.1; phi1 -= 0.05) {
      const cand = attempt(uEnd, phi1, false);
      if (!cand) continue;
      const col = findFirstCollision(cand.path, p, geo, neighbors);
      if (!col) return { ...cand, collision: null };
      if (!nominal) nominal = { ...cand, collision: col };
    }
  }
  if (!nominal) {
    const cand = attempt(uCenter, Math.max(0.2, Math.min(0.7, phiCap)), true);
    nominal = { ...cand, collision: findFirstCollision(cand.path, p, geo, neighbors) };
  }
  return nominal;
}


function findFirstCollision(path, p, geo, neighbors) {
  const step = 0.12;
  for (let s = 0; s <= path.totalLength + 1e-9; s += step) {
    const pose = path.poseAt(s);
    const ego = egoCorners(p, geo, pose);
    for (let i = 0; i < neighbors.length; i++) {
      const n = neighbors[i];
      if (polysIntersectSAT(ego, rectCorners(n.cx, n.cy, n.hl, n.hw, 0))) {
        return { s, neighborIndex: i };
      }
    }
  }
  return null;
}

function buildPath(segments) {
  let total = 0;
  const withOffsets = segments.map((seg) => {
    const offset = total;
    total += seg.length;
    return { seg, offset };
  });
  return {
    totalLength: total,
    poseAt(s) {
      s = Math.max(0, Math.min(total, s));
      for (const { seg, offset } of withOffsets) {
        if (s <= offset + seg.length + 1e-6 || seg === withOffsets[withOffsets.length - 1].seg) {
          return { ...seg.sample(Math.min(s - offset, seg.length)), gear: seg.gear, curvatureSign: seg.curvatureSign };
        }
      }
    },
    segmentsInfo: withOffsets,
  };
}

// A path traversed backwards with the gear inverted is kinematically valid:
// the wheel angle at each point is unchanged, only the travel direction flips.
function reverseSegment(seg) {
  return {
    length: seg.length,
    gear: -seg.gear,
    curvatureSign: seg.curvatureSign,
    sample(s) {
      return seg.sample(seg.length - s);
    },
  };
}

// Exit manoeuvre = the entry path minus its lead-in, played backwards, plus a
// straight drive-off down the lane. Collision-free by construction whenever
// the entry was.
function buildExitPath(entryPath) {
  const segs = entryPath.segmentsInfo.map((o) => o.seg);
  if (segs.length < 2) return null;
  const rev = segs.slice(1).reverse().map(reverseSegment);
  const out = segs[1].sample(0); // pose where the entry manoeuvre began
  rev.push(makeStraight(out.pos, out.theta, APPROACH_LEN + 2, 1));
  return buildPath(rev);
}

// ---------- parking maneuver generation ----------

const APPROACH_LEN = 7.5; // meters of straight lead-in for camera context

function computeGeometry(p) {
  const frontOverhang = (p.carLength - p.wheelbase) / 2;
  const rearOverhang = frontOverhang;
  const maxSteerRad = Math.atan(p.wheelbase / p.turnRadius);
  return { frontOverhang, rearOverhang, maxSteerRad, maxSteerDeg: maxSteerRad / RAD };
}

function computeBayManeuver(p, geo) {
  // Plan: straight along lane -> single arc -> straight along spot axis.
  const R = p.turnRadius;
  const gear = p.entryMode === "reverse" ? -1 : 1;
  const aisleDir = { x: p.laneDir, y: 0 };
  const thetaStart = V.angle(aisleDir);
  const N = V.leftNormal(aisleDir);

  const angleDegUsed = p.spotType === "perp" ? 90 : p.angleDeg;
  const tiltMag = (90 - angleDegUsed) * RAD;
  // Angled spots lean downstream for forward entry, upstream for reverse entry,
  // so the arc sweep stays small — matching how angled lots are actually laid out.
  const leanDir = gear * p.laneDir;
  const spotAxis = { x: leanDir * Math.sin(tiltMag), y: p.rowSide * Math.cos(tiltMag) };

  const spotMouth = { x: 0, y: p.rowSide * (p.laneWidth / 2) };
  const frontClearance = 0.3;
  const spotDeep = V.add(spotMouth, V.scale(spotAxis, p.spotDepth - frontClearance));

  const finalHeadingVec = V.scale(spotAxis, gear);
  const finalHeadingAngle = V.angle(finalHeadingVec);

  const Pf =
    gear > 0
      ? V.sub(spotDeep, V.scale(spotAxis, geo.frontOverhang + p.wheelbase))
      : V.sub(spotDeep, V.scale(spotAxis, geo.rearOverhang));

  let dTheta = finalHeadingAngle - thetaStart;
  while (dTheta > Math.PI) dTheta -= 2 * Math.PI;
  while (dTheta < -Math.PI) dTheta += 2 * Math.PI;

  const turnSign = gear * Math.sign(dTheta || 1);
  const arcLen = R * Math.abs(dTheta);

  // Approach hugging the far side of the lane for maximum swing room.
  const yOff = Math.max(0, p.laneWidth / 2 - p.carWidth / 2 - 0.4);
  const yDrive = -p.rowSide * yOff;

  // After the arc the heading equals the final heading; the arc-exit point Pa
  // must lie on the spot-axis line through Pf. C.y is fixed by tangency to the lane.
  const Cy = yDrive + N.y * R * turnSign;
  const lnf = V.leftNormal(finalHeadingVec);
  const PaY = Cy - lnf.y * R * turnSign;
  const PaX = Pf.x + ((PaY - Pf.y) * spotAxis.x) / spotAxis.y;
  const x0 = PaX + lnf.x * R * turnSign;
  const P0 = { x: x0, y: yDrive };
  const C = { x: x0, y: Cy };
  const Pa = { x: PaX, y: PaY };

  const dStraight = V.dot(V.sub(Pf, Pa), spotAxis);

  const leadStart = V.sub(P0, V.scale(aisleDir, APPROACH_LEN));
  const segs = [
    makeStraight(leadStart, thetaStart, APPROACH_LEN, 1),
    makeArc(C, R, turnSign, gear, thetaStart, arcLen),
  ];
  if (dStraight > 0.01) segs.push(makeStraight(Pa, finalHeadingAngle, dStraight, gear));

  const warnings = [];
  if (dStraight < 0) warnings.push("迴轉半徑相對車道與車格過大，單一圓弧會越過停止點，實際需多次前後修正。");
  if (p.spotDepth <= p.carLength + 0.3) warnings.push("停車格深度可能不足以容納此車長，車頭/車尾可能突出。");
  if (p.spotWidth <= p.carWidth + 0.3) warnings.push("停車格寬度偏窄，車輛可能無法置中停放。");
  const feasible = warnings.length === 0;

  return {
    path: buildPath(segs),
    spotRect: { center: V.add(spotMouth, V.scale(spotAxis, p.spotDepth / 2)), axis: spotAxis, width: p.spotWidth, depth: p.spotDepth },
    mouth: spotMouth,
    feasible,
    warnings,
    finalPose: { pos: Pf, theta: finalHeadingAngle },
  };
}

function computeParallelManeuver(p, geo) {
  const gear = -1; // always reverse-in
  const aisleDir = { x: p.laneDir, y: 0 };
  const thetaStart = V.angle(aisleDir);

  const halfRoad = p.laneWidth / 2;
  // The parallel bay sits at the kerb, outside the driving lane; the car parks
  // centred in the bay, whose lateral size is the spot-width parameter.
  const yFinal = p.rowSide * (halfRoad + p.spotWidth / 2);
  // Candidate starting lateral positions, from hugging the parked row (small
  // swing) progressively out across the road width to the far side (bigger
  // entry angle, cutting in earlier) — use whatever the lane offers to find a
  // plan that actually fits.
  const yHugAbs = Math.min(Math.abs(yFinal) - p.carWidth - 0.4, halfRoad - p.carWidth / 2 - 0.1);
  const yFarAbs = -(halfRoad - p.carWidth / 2 - 0.2);
  const yCandidates = [];
  for (let ya = yHugAbs; ya >= yFarAbs - 1e-9; ya -= 0.45) yCandidates.push(ya);

  // Rear-axle target such that the car body ends up centred in the spot box.
  const xf = -p.laneDir * ((p.wheelbase + geo.frontOverhang - geo.rearOverhang) / 2);
  const turnSign1 = p.rowSide * p.laneDir;

  const kMax = 1 / p.turnRadius;

  // Worst case: the neighbouring stalls are fully occupied — the blocking
  // rectangles span the entire stall (full spot width, flush with the bay
  // lines), since the neighbours' parking position can't be controlled.
  const nHalfL = p.spotDepth / 2, nHalfW = p.spotWidth / 2;
  const neighbors = [
    { cx: -p.spotDepth, cy: yFinal, hl: nHalfL, hw: nHalfW },
    { cx: p.spotDepth, cy: yFinal, hl: nHalfL, hw: nHalfW },
  ];

  // Classic technique: reverse deep toward the rear car (0.3 m margin), then
  // pull forward to centre — keeps the swinging phase clear of the front car.
  const dForward = Math.max(0, p.spotDepth / 2 - p.carLength / 2 - 0.3);
  const xfReverse = xf - p.laneDir * dForward;

  // Parking style is user-selected; a collision does not trigger any fallback
  // — playback simply stops at the impact point. The starting lateral
  // position is searched across the road width (hug the row first, then move
  // out toward the far side for a bigger, earlier cut).
  let feasible = true, path = null, collision = null, usedYa = yHugAbs;
  const info = [];
  if (p.parkStyle === "deep") {
    // 深切停車: dive past the parked line, one forward arc to align.
    let chosen = null, nominal = null;
    for (const ya of yCandidates) {
      const dive = buildDeepDive(p, geo, thetaStart, aisleDir, p.rowSide * ya, yFinal, kMax, turnSign1, neighbors);
      if (!dive.collision) { chosen = { dive, ya }; break; }
      if (!nominal) nominal = { dive, ya };
    }
    const pick = chosen || nominal;
    path = pick.dive.path;
    collision = pick.dive.collision;
    usedYa = pick.ya;
    if (!collision) {
      info.push(`深切（${(pick.dive.phi1 * 57.3).toFixed(0)}°）＋前進回正：${pick.dive.moves} 段移動、${pick.dive.moves - 1} 次換檔，停於車格中央。`);
    }
  } else {
    // 一般停車: single-shot S-curve with rate-limited steering. Start with a
    // leisurely wind; if the swing would clip a neighbour, wind faster —
    // like a driver working a tighter gap — before giving up.
    // Two plan shapes per starting position: a pure S-curve (small lateral
    // offsets), or "cut early, run the diagonal, tuck in" — wind to the entry
    // angle, hold a straight diagonal run, then wind back straight — which
    // covers any offset the road width allows. The reverse-phase end anchor
    // uSEnd is also searched: ending toward the FRONT of the bay means the
    // turn starts earlier and the tail never sweeps into the rear stall;
    // centring then just continues in reverse (no extra gear change).
    const uCenterN = -((p.wheelbase + geo.frontOverhang - geo.rearOverhang) / 2);
    const uFrontMax = p.spotDepth / 2 - (p.wheelbase + geo.frontOverhang) - 0.15;
    const uSEndCandidates = [uFrontMax, (uFrontMax + uCenterN) / 2, uCenterN, uCenterN - dForward]
      .filter((u, i, a) => a.indexOf(u) === i && u >= uCenterN - dForward - 1e-9);
    const buildNormal = (ya, dRamp, uSEnd) => {
      const yD = p.rowSide * ya;
      const target = yFinal - yD;
      const xEnd = uSEnd * p.laneDir;
      const sol = solveSCurve(target, kMax, dRamp, thetaStart, gear, turnSign1);
      let segs;
      if (sol.feasible) {
        const table = integrateSCurve(sol.kPeak * turnSign1, sol.L, sol.dRamp, thetaStart, gear);
        const P0 = { x: xEnd - table.dx, y: yD };
        segs = [makeStraight(V.sub(P0, V.scale(aisleDir, APPROACH_LEN)), thetaStart, APPROACH_LEN, 1), makeTableSegment(P0, table, gear)];
      } else {
        const thMax = state.thetaCap || 0.87;
        const dRe = Math.min(dRamp, thMax / kMax);
        const Lh = Math.max(0, thMax / kMax - dRe);
        const windIn = integrateWind(kMax * turnSign1, Lh, dRe, thetaStart, -1);
        const thDive = thetaStart - turnSign1 * thMax;
        const hDive = V.fromAngle(thDive);
        const windOut = integrateWind(-kMax * turnSign1, Lh, dRe, thDive, -1);
        const dyPerM = -Math.sin(thDive);
        const D = Math.max(0, (target - windIn.dy - windOut.dy) / dyPerM);
        const sEnd = { x: xEnd, y: yD + target };
        const windOutStart = { x: sEnd.x - windOut.dx, y: sEnd.y - windOut.dy };
        const diagStart = V.add(windOutStart, V.scale(hDive, D));
        const P0 = { x: diagStart.x - windIn.dx, y: diagStart.y - windIn.dy };
        segs = [
          makeStraight(V.sub(P0, V.scale(aisleDir, APPROACH_LEN)), thetaStart, APPROACH_LEN, 1),
          makeTableSegment(P0, windIn, -1),
        ];
        if (D > 0.01) segs.push(makeStraight(diagStart, thDive, D, -1));
        segs.push(makeTableSegment(windOutStart, windOut, -1));
      }
      // Centre the car: continue reversing if the S ended forward of centre,
      // otherwise pull forward.
      const dC = uSEnd - uCenterN;
      const endPos = { x: xEnd, y: yFinal };
      if (dC > 0.02) segs.push(makeStraight(endPos, thetaStart, dC, -1));
      else if (dC < -0.02) segs.push(makeStraight(endPos, thetaStart, -dC, 1));
      return buildPath(segs);
    };

    let nominal = null, found = false;
    for (const ya of yCandidates) {
      for (const uSEnd of uSEndCandidates) {
        for (const dRamp of [1.5, 0.6]) {
          const cand = buildNormal(ya, dRamp, uSEnd);
          const col = findFirstCollision(cand, p, geo, neighbors);
          if (!col) {
            path = cand; collision = null; feasible = true; usedYa = ya; found = true;
            break;
          }
          if (!nominal) nominal = { path: cand, col, ya };
        }
        if (found) break;
      }
      if (found) break;
    }
    if (!found) {
      path = nominal.path; collision = nominal.col; usedYa = nominal.ya;
    }
  }
  if (!collision && usedYa < yHugAbs - 0.01) {
    const side = usedYa < -0.05 ? "借用對向側" : "移向車道中間";
    info.push(`已利用車道寬度：起始位置外移 ${(yHugAbs - usedYa).toFixed(1)} m（${side}），提早切入。`);
  }

  const warnings = [];
  if (!feasible) warnings.push("車道過寬或迴轉半徑過大，單次倒車無法貼到路邊位置。");
  if (collision) warnings.push("此參數會擦撞到鄰格車輛（紅框標示），播放將停於撞擊點。可改用另一種停車方式或加大車位。");
  if (p.spotDepth < p.carLength * 1.15) warnings.push("平行停車格深度偏短，建議至少為車長的 1.2 倍以上。");
  if (p.spotWidth < p.carWidth + 0.2) warnings.push("路邊車格寬度不足，車身可能超出車格。");

  return {
    path,
    spotRect: { center: { x: 0, y: yFinal }, axis: aisleDir, width: p.spotWidth, depth: p.spotDepth },
    mouth: { x: 0, y: p.rowSide * halfRoad },
    feasible: warnings.length === 0,
    warnings,
    info,
    neighbors,
    collision,
    finalPose: { pos: { x: xf, y: yFinal }, theta: thetaStart },
  };
}

function computeManeuver(p) {
  const geo = computeGeometry(p);
  const result = p.spotType === "parallel" ? computeParallelManeuver(p, geo) : computeBayManeuver(p, geo);
  if (p.wheelbase > p.carLength) result.warnings.push("軸距大於車長，前後輪會超出車身範圍。");
  if (p.track > p.carWidth) result.warnings.push("輪距大於車寬，左右輪會超出車身範圍。");
  result.exitPath = buildExitPath(result.path);
  return { ...result, geo };
}

// ---------- state ----------
const state = {
  vehicleType: "car",
  simMode: "in", // "in" = 駛入, "out" = 停妥後駛出
  parkStyle: "normal", // 平行停車方式: "normal" = 一般, "deep" = 深切
  spotType: "perp",
  angleDeg: 45,
  laneDir: 1,
  rowSide: 1,
  entryMode: "reverse",
  carLength: 2.47,
  carWidth: 0.97,
  wheelbase: 1.8,
  track: 0.85,
  turnRadius: 3.6,
  spotWidth: 2.5,
  spotDepth: 6,
  laneWidth: 6,
  showPath: true,
  showTrail: true,
  showWheelTrail: true,
  showMeasure: true,
  speed: 1,
  playing: false,
  traveled: 0,
  manoeuvre: null,
};

function activePath() {
  return state.simMode === "out" && state.manoeuvre.exitPath ? state.manoeuvre.exitPath : state.manoeuvre.path;
}

function recompute() {
  state.manoeuvre = computeManeuver(state);
  state.traveled = 0;
  updateWarningBox();
  updateReadouts();
}

function updateWarningBox() {
  const box = document.getElementById("warningBox");
  const warnings = state.manoeuvre.warnings;
  const infos = state.manoeuvre.info || [];
  if (warnings.length + infos.length === 0) {
    box.style.display = "none";
    box.textContent = "";
  } else {
    box.style.display = "block";
    box.innerHTML = infos.map((t) => "ℹ " + t).concat(warnings.map((t) => "⚠ " + t)).join("<br>");
    box.classList.toggle("notice", warnings.length === 0);
  }
}

function updateReadouts() {
  const geo = state.manoeuvre.geo;
  document.getElementById("steerReadout").textContent = `最大轉向角：約 ${geo.maxSteerDeg.toFixed(0)}°`;
}

// ---------- rendering ----------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let PPM = 40; // pixels per meter, recalculated to fit
let camOffset = { x: 0, y: 0 };

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitCamera();
}

function collectBoundsPoints() {
  const pts = [];
  const path = activePath();
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const s = (path.totalLength * i) / N;
    pts.push(path.poseAt(s).pos);
  }
  const sr = state.manoeuvre.spotRect;
  const half = V.leftNormal(sr.axis);
  for (const sSign of [-1, 1]) {
    for (const dSign of [0, 1]) {
      pts.push(V.add(V.add(sr.center, V.scale(sr.axis, (dSign - 0.5) * sr.depth)), V.scale(half, (sSign * sr.width) / 2)));
    }
  }
  if (state.manoeuvre.neighbors) {
    for (const n of state.manoeuvre.neighbors) {
      pts.push(...rectCorners(n.cx, n.cy, n.hl, n.hw, 0));
    }
  }
  return pts;
}

function fitCamera() {
  const pts = collectBoundsPoints();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const pt of pts) {
    minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
    minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
  }
  const pad = 3.5;
  minX -= pad; maxX += pad; minY -= pad; maxY += pad;
  const w = maxX - minX, h = maxY - minY;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / w, scaleY = rect.height / h;
  PPM = Math.min(scaleX, scaleY);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  camOffset = { x: rect.width / 2 - cx * PPM, y: rect.height / 2 - cy * PPM };
}

function toScreen(p) {
  return { x: p.x * PPM + camOffset.x, y: p.y * PPM + camOffset.y };
}

function drawBackground() {
  const rect = canvas.getBoundingClientRect();
  ctx.fillStyle = "#3a3d42";
  ctx.fillRect(0, 0, rect.width, rect.height);

  // aisle band
  const halfLane = state.laneWidth / 2;
  const top = toScreen({ x: -1000, y: -halfLane });
  const bot = toScreen({ x: -1000, y: halfLane });
  ctx.fillStyle = "#46494f";
  ctx.fillRect(0, top.y, rect.width, bot.y - top.y);

  // lane centerline dashed
  ctx.strokeStyle = "#d8c96a";
  ctx.lineWidth = Math.max(1.5, 0.06 * PPM);
  ctx.setLineDash([0.5 * PPM, 0.4 * PPM]);
  const cl0 = toScreen({ x: -1000, y: 0 });
  const cl1 = toScreen({ x: 1000, y: 0 });
  ctx.beginPath();
  ctx.moveTo(cl0.x, cl0.y);
  ctx.lineTo(cl1.x, cl1.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawSpot() {
  const sr = state.manoeuvre.spotRect;
  const half = V.leftNormal(sr.axis);
  const corners = [
    V.add(sr.center, V.add(V.scale(sr.axis, -sr.depth / 2), V.scale(half, sr.width / 2))),
    V.add(sr.center, V.add(V.scale(sr.axis, sr.depth / 2), V.scale(half, sr.width / 2))),
    V.add(sr.center, V.add(V.scale(sr.axis, sr.depth / 2), V.scale(half, -sr.width / 2))),
    V.add(sr.center, V.add(V.scale(sr.axis, -sr.depth / 2), V.scale(half, -sr.width / 2))),
  ].map(toScreen);

  ctx.strokeStyle = state.manoeuvre.feasible ? "#f5d442" : "#e0764a";
  ctx.lineWidth = Math.max(2, 0.05 * PPM);
  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
  ctx.closePath();
  ctx.stroke();

  // neighbouring spots (context only) for perpendicular/angle types
  if (state.spotType !== "parallel") {
    // Neighbouring stalls sit side by side along the lane, so the offset is
    // horizontal with spacing = width / |axis.y| (equals width for 90° spots).
    const spacing = sr.width / Math.max(0.2, Math.abs(sr.axis.y));
    for (const off of [-1, 1]) {
      const c2 = V.add(sr.center, { x: off * spacing, y: 0 });
      const cc = [
        V.add(c2, V.add(V.scale(sr.axis, -sr.depth / 2), V.scale(half, sr.width / 2))),
        V.add(c2, V.add(V.scale(sr.axis, sr.depth / 2), V.scale(half, sr.width / 2))),
        V.add(c2, V.add(V.scale(sr.axis, sr.depth / 2), V.scale(half, -sr.width / 2))),
        V.add(c2, V.add(V.scale(sr.axis, -sr.depth / 2), V.scale(half, -sr.width / 2))),
      ].map(toScreen);
      ctx.strokeStyle = "#7d7f85";
      ctx.beginPath();
      ctx.moveTo(cc[0].x, cc[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(cc[i].x, cc[i].y);
      ctx.closePath();
      ctx.stroke();
    }
  }

  if (state.showMeasure) {
    const label = toScreen(V.add(sr.center, V.scale(half, sr.width / 2 + 0.6)));
    ctx.fillStyle = "#c7ceda";
    ctx.font = "12px sans-serif";
    ctx.fillText(`${sr.width.toFixed(1)}m x ${sr.depth.toFixed(1)}m`, label.x - 30, label.y);
  }
}

function drawNeighbors() {
  const m = state.manoeuvre;
  if (!m.neighbors) return;
  m.neighbors.forEach((n, i) => {
    const tl = toScreen({ x: n.cx - n.hl, y: n.cy - n.hw });
    const w = 2 * n.hl * PPM, h = 2 * n.hw * PPM;
    ctx.fillStyle = "#5a6069";
    roundRect(ctx, tl.x, tl.y, w, h, 5);
    ctx.fill();
    ctx.fillStyle = "#4a5058";
    roundRect(ctx, tl.x + w * 0.55, tl.y + h * 0.12, w * 0.2, h * 0.76, 3);
    ctx.fill();
    const hit = state.simMode === "in" && m.collision && m.collision.neighborIndex === i && state.traveled >= m.collision.s - 1e-6;
    ctx.strokeStyle = hit ? "#ff5c5c" : "#3a4048";
    ctx.lineWidth = hit ? 3 : 1.5;
    roundRect(ctx, tl.x, tl.y, w, h, 5);
    ctx.stroke();
  });
}

function drawPlannedPath() {
  if (!state.showPath) return;
  const path = activePath();
  ctx.strokeStyle = "rgba(120,190,255,0.55)";
  ctx.lineWidth = Math.max(1.5, 0.035 * PPM);
  ctx.setLineDash([0.25 * PPM, 0.2 * PPM]);
  ctx.beginPath();
  const N = 80;
  for (let i = 0; i <= N; i++) {
    const s = (path.totalLength * i) / N;
    const pt = toScreen(path.poseAt(s).pos);
    if (i === 0) ctx.moveTo(pt.x, pt.y);
    else ctx.lineTo(pt.x, pt.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawTrail() {
  if (!state.showTrail) return;
  const path = activePath();
  ctx.strokeStyle = "#4fd47a";
  ctx.lineWidth = Math.max(2, 0.045 * PPM);
  ctx.beginPath();
  const N = Math.max(4, Math.floor((state.traveled / path.totalLength) * 100));
  for (let i = 0; i <= N; i++) {
    const s = (state.traveled * i) / N;
    const pt = toScreen(path.poseAt(s).pos);
    if (i === 0) ctx.moveTo(pt.x, pt.y);
    else ctx.lineTo(pt.x, pt.y);
  }
  ctx.stroke();
}

// Wheel positions in the vehicle frame (origin = rear axle centre).
// A tadpole trike steers its two front wheels and has a single centred rear
// wheel — the bicycle-model body path is identical to a car's; only the
// wheel tracks (swept paths) differ.
function wheelLayout(p) {
  const front = [
    { x: p.wheelbase, y: p.track / 2, steers: true, rear: false },
    { x: p.wheelbase, y: -p.track / 2, steers: true, rear: false },
  ];
  const rear =
    p.vehicleType === "trike"
      ? [{ x: 0, y: 0, steers: false, rear: true }]
      : [
          { x: 0, y: p.track / 2, steers: false, rear: true },
          { x: 0, y: -p.track / 2, steers: false, rear: true },
        ];
  return front.concat(rear);
}

function drawWheelTrails() {
  if (!state.showWheelTrail || state.traveled <= 0) return;
  const path = activePath();
  const wheels = wheelLayout(state);
  const N = Math.max(8, Math.floor((state.traveled / path.totalLength) * 140));
  ctx.lineWidth = Math.max(1, 0.025 * PPM);
  for (const w of wheels) {
    ctx.strokeStyle = w.rear ? "rgba(120,220,255,0.7)" : "rgba(255,175,70,0.7)";
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const pose = path.poseAt((state.traveled * i) / N);
      const pt = toScreen(V.add(pose.pos, rotateLocal({ x: w.x, y: w.y }, pose.theta)));
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }
}

function drawWheel(origin, localPos, bodyTheta, steerAngle, wheelLen, wheelWidth) {
  ctx.save();
  const world = V.add(origin, rotateLocal(localPos, bodyTheta));
  const screenPos = toScreen(world);
  ctx.translate(screenPos.x, screenPos.y);
  ctx.rotate(bodyTheta + steerAngle);
  ctx.fillStyle = "#111417";
  ctx.strokeStyle = "rgba(220,230,240,0.75)";
  ctx.lineWidth = 1;
  roundRect(ctx, (-wheelLen / 2) * PPM, (-wheelWidth / 2) * PPM, wheelLen * PPM, wheelWidth * PPM, 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function rotateLocal(local, theta) {
  const c = Math.cos(theta), s = Math.sin(theta);
  return { x: local.x * c - local.y * s, y: local.x * s + local.y * c };
}

function drawCar(pose) {
  const p = state;
  const geo = state.manoeuvre.geo;
  const rearAxle = pose.pos;
  const theta = pose.theta;

  const steerAngle = Math.atan(p.wheelbase * (pose.kappa || 0));

  // shadow
  const centerLocal = { x: (p.wheelbase + geo.frontOverhang - geo.rearOverhang) / 2, y: 0 };
  const centerWorld = V.add(rearAxle, rotateLocal(centerLocal, theta));
  const centerScreen = toScreen(centerWorld);

  ctx.save();
  ctx.translate(centerScreen.x, centerScreen.y);
  ctx.rotate(theta);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  const bodyLen = p.carLength * PPM;
  const bodyWid = p.carWidth * PPM;
  roundRect(ctx, -bodyLen / 2 - 2, -bodyWid / 2 - 2 + 3, bodyLen + 4, bodyWid + 4, 6 * PPM / 40);
  ctx.fill();
  ctx.restore();

  // body
  ctx.save();
  ctx.translate(centerScreen.x, centerScreen.y);
  ctx.rotate(theta);
  const grad = ctx.createLinearGradient(0, -bodyWid / 2, 0, bodyWid / 2);
  grad.addColorStop(0, "#4fa8e0");
  grad.addColorStop(0.5, "#2d78c9");
  grad.addColorStop(1, "#1c5a9c");
  ctx.fillStyle = grad;
  roundRect(ctx, -bodyLen / 2, -bodyWid / 2, bodyLen, bodyWid, 6 * PPM / 40);
  ctx.fill();
  ctx.strokeStyle = "#0e2c4a";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // windshield (front indicator)
  ctx.fillStyle = "rgba(200,230,255,0.55)";
  roundRect(ctx, bodyLen / 2 - bodyLen * 0.32, -bodyWid / 2 + 3, bodyLen * 0.22, bodyWid - 6, 3);
  ctx.fill();

  // headlights
  ctx.fillStyle = "#fff6c8";
  ctx.fillRect(bodyLen / 2 - 3, -bodyWid / 2 + 2, 3, 5);
  ctx.fillRect(bodyLen / 2 - 3, bodyWid / 2 - 7, 3, 5);
  // taillights
  ctx.fillStyle = "#e04b4b";
  ctx.fillRect(-bodyLen / 2, -bodyWid / 2 + 2, 3, 5);
  ctx.fillRect(-bodyLen / 2, bodyWid / 2 - 7, 3, 5);

  ctx.restore();

  // Wheels drawn on top of the body (blueprint style) at their true positions,
  // so the track / wheelbase sliders are directly visible.
  const wheelLen = 0.72, wheelWidth = 0.3;
  for (const w of wheelLayout(p)) {
    drawWheel(rearAxle, w, theta, w.steers ? steerAngle : 0, wheelLen, wheelWidth);
  }

  return steerAngle;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function render() {
  drawBackground();
  drawSpot();
  drawNeighbors();
  drawPlannedPath();
  drawTrail();
  drawWheelTrails();
  const pose = activePath().poseAt(state.traveled);
  const steerAngle = drawCar(pose);

  const col = state.simMode === "in" ? state.manoeuvre.collision : null;
  if (col && state.traveled >= col.s - 1e-6) {
    const corners = egoCorners(state, state.manoeuvre.geo, pose).map(toScreen);
    ctx.strokeStyle = "#ff5c5c";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
    ctx.closePath();
    ctx.stroke();
  }

  document.getElementById("hudGear").textContent = pose.gear > 0 ? "D" : "R";
  document.getElementById("hudSteer").textContent = (steerAngle / RAD).toFixed(0) + "°";
  const progress = Math.round((state.traveled / activePath().totalLength) * 100);
  document.getElementById("hudProgress").textContent = progress + "%";
}

// ---------- animation ----------
let lastTime = null;
function tick(now) {
  if (lastTime === null) lastTime = now;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (state.playing) {
    const carSpeed = 1.4; // m/s baseline
    const prev = state.traveled;
    state.traveled += carSpeed * state.speed * dt;
    const col = state.simMode === "in" ? state.manoeuvre.collision : null;
    if (col && prev < col.s && state.traveled >= col.s) {
      // Stop playback at the moment of impact; pressing play again continues.
      state.traveled = col.s;
      state.playing = false;
      document.getElementById("btnPlay").textContent = "▶ 播放";
    }
    if (state.traveled >= activePath().totalLength) {
      state.traveled = activePath().totalLength;
      state.playing = false;
      document.getElementById("btnPlay").textContent = "▶ 播放";
    }
  }
  render();
  requestAnimationFrame(tick);
}

// ---------- UI wiring ----------
function bindSegmented(groupSelector, key, onChange) {
  document.querySelectorAll(groupSelector).forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(groupSelector).forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      onChange(btn);
    });
  });
}

function bindSlider(id, key, fmt) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id + "Val");
  el.addEventListener("input", () => {
    state[key] = parseFloat(el.value);
    if (valEl) valEl.textContent = fmt(state[key]);
    recompute();
    fitCamera();
  });
}

function setupUI() {
  // spot type
  document.querySelectorAll("#spotTypeGroup .seg").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#spotTypeGroup .seg").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.spotType = btn.dataset.type;
      document.getElementById("angleField").style.display = state.spotType === "angle" ? "block" : "none";
      const entryField = document.getElementById("entryModeField");
      entryField.style.display = state.spotType === "parallel" ? "none" : "block";
      document.getElementById("parkStyleField").style.display = state.spotType === "parallel" ? "block" : "none";
      if (state.spotType === "parallel") state.entryMode = "reverse";
      recompute();
      fitCamera();
    });
  });

  bindSegmented('[data-vehicle]', "vehicleType", (btn) => {
    state.vehicleType = btn.dataset.vehicle;
    document.getElementById("vehicleNote").style.display = state.vehicleType === "trike" ? "block" : "none";
  });

  bindSegmented('[data-park]', "parkStyle", (btn) => {
    state.parkStyle = btn.dataset.park;
    recompute();
    fitCamera();
  });

  bindSegmented('[data-sim]', "simMode", (btn) => {
    state.simMode = btn.dataset.sim;
    state.traveled = 0;
    state.playing = false;
    document.getElementById("btnPlay").textContent = "▶ 播放";
    fitCamera();
  });

  bindSegmented('[data-lane]', "laneDir", (btn) => {
    state.laneDir = parseInt(btn.dataset.lane, 10);
    recompute();
    fitCamera();
  });
  bindSegmented('[data-row]', "rowSide", (btn) => {
    state.rowSide = parseInt(btn.dataset.row, 10);
    recompute();
    fitCamera();
  });
  bindSegmented('[data-entry]', "entryMode", (btn) => {
    state.entryMode = btn.dataset.entry;
    recompute();
    fitCamera();
  });

  document.getElementById("angleDeg").addEventListener("input", (e) => {
    state.angleDeg = parseFloat(e.target.value);
    document.getElementById("angleDegVal").textContent = state.angleDeg + "°";
    recompute();
    fitCamera();
  });

  bindSlider("carLength", "carLength", (v) => v.toFixed(2) + " m");
  bindSlider("carWidth", "carWidth", (v) => v.toFixed(2) + " m");
  bindSlider("wheelbase", "wheelbase", (v) => v.toFixed(2) + " m");
  bindSlider("track", "track", (v) => v.toFixed(2) + " m");
  bindSlider("turnRadius", "turnRadius", (v) => v.toFixed(1) + " m");
  bindSlider("spotWidth", "spotWidth", (v) => v.toFixed(1) + " m");
  bindSlider("spotDepth", "spotDepth", (v) => v.toFixed(1) + " m");
  bindSlider("laneWidth", "laneWidth", (v) => v.toFixed(1) + " m");

  document.getElementById("showPath").addEventListener("change", (e) => (state.showPath = e.target.checked));
  document.getElementById("showTrail").addEventListener("change", (e) => (state.showTrail = e.target.checked));
  document.getElementById("showWheelTrail").addEventListener("change", (e) => (state.showWheelTrail = e.target.checked));
  document.getElementById("showMeasure").addEventListener("change", (e) => (state.showMeasure = e.target.checked));

  document.getElementById("speed").addEventListener("input", (e) => {
    state.speed = parseFloat(e.target.value);
    document.getElementById("speedVal").textContent = state.speed.toFixed(1) + "x";
  });

  document.getElementById("btnPlay").addEventListener("click", () => {
    if (state.traveled >= activePath().totalLength) state.traveled = 0;
    state.playing = !state.playing;
    document.getElementById("btnPlay").textContent = state.playing ? "⏸ 暫停" : "▶ 播放";
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    state.traveled = 0;
    state.playing = false;
    document.getElementById("btnPlay").textContent = "▶ 播放";
  });
  document.getElementById("btnStep").addEventListener("click", () => {
    state.playing = false;
    document.getElementById("btnPlay").textContent = "▶ 播放";
    state.traveled = Math.min(activePath().totalLength, state.traveled + 0.3);
  });

  window.addEventListener("resize", resizeCanvas);
}

setupUI();
recompute();
resizeCanvas();
requestAnimationFrame(tick);

window.__debugSim = { state, recompute, fitCamera, computeManeuver };
})();
</script>
</body>
</html>

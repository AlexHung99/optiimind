<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OptiChat 聊天介面示意</title>
  <desc id="desc">左側是日期對話紀錄與搜尋；右側顯示圖片附件、AI 回覆、輸入框與資源監控。</desc>
  <defs>
    <linearGradient id="backdrop" x2="1" y2="1">
      <stop stop-color="#05131e"/>
      <stop offset="1" stop-color="#0c3342"/>
    </linearGradient>
    <linearGradient id="preview" x2="1" y2="1">
      <stop stop-color="#1a8a9a"/>
      <stop offset=".5" stop-color="#6855aa"/>
      <stop offset="1" stop-color="#e49a5f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="app-clip"><rect x="28" y="22" width="1144" height="631" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#backdrop)"/>
